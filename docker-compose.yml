services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "3001:3001"
    command: python start.py

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - ./.env
    environment:
      - VITE_API_PROXY_TARGET=http://backend:3001
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
